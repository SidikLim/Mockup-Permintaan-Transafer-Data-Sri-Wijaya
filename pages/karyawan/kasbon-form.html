<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas Bon - MASERP Mockup</title>
<link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-active-menu="kas-bon">

<div id="app-header"></div>
<div id="app-sidebar"></div>

<main class="app-main">
  <div class="page-card">
    <div class="page-card__header">
      <div class="page-card__title" id="pageTitle">+ Kas Bon</div>
      <div class="page-card__actions">
        <button class="btn btn-outline" id="btnActivityLog" type="button">&#128269; Activity Log</button>
        <button class="btn btn-outline" id="btnHelp" type="button">? Help</button>
      </div>
    </div>

    <div class="page-card__body">
      <h2 style="font-size:19px;margin:0 0 18px;">Kas Bon</h2>

      <!-- Baris 1: No Transaksi, C.A. Number, Departemen, Proyek -->
      <div class="field-row">
        <div class="field-group">
          <label>No. Transaksi</label>
          <div class="with-btn">
            <input type="text" id="fNoTransaksi" disabled>
            <button class="btn-icon blue" id="btnRegenNo" type="button" title="Regenerasi nomor">&#8635;</button>
          </div>
        </div>
        <div class="field-group">
          <label>C.A. Number</label>
          <input type="text" id="fCaNumber" placeholder="C.A. Number">
        </div>
        <div class="field-group">
          <label>Departemen</label>
          <select id="fDepartemen">
            <option>GA-HR</option>
            <option>PUSAT</option>
            <option>SANGATTA</option>
            <option>PROJECT</option>
          </select>
        </div>
        <div class="field-group wide">
          <label>Proyek</label>
          <div class="with-btn">
            <input type="text" id="fProyek" placeholder="Pilih project (opsional)">
            <button class="btn-icon blue" id="btnPickProyek" type="button">&#128269;</button>
          </div>
        </div>
      </div>

      <!-- Baris 2: Karyawan | Kurs | Mata Uang | Jumlah | Tgl. Trn -->
      <div class="field-row">
        <div class="field-group wide">
          <label>Karyawan <span style="color:var(--danger);">*</span></label>
          <div class="with-btn">
            <input type="text" id="fKaryawan" placeholder="Nama karyawan" list="karyawanList">
            <button class="btn-icon blue" id="btnPickKaryawan" type="button">&#128269;</button>
          </div>
          <datalist id="karyawanList"></datalist>
        </div>
        <div class="field-group narrow">
          <label>Kurs</label>
          <input type="text" id="fKursKaryawan" disabled>
        </div>
        <div class="field-group narrow">
          <label>Mata Uang</label>
          <input type="text" id="fMataUangKaryawan" disabled>
        </div>
        <div class="field-group">
          <label>Jumlah <span style="color:var(--danger);">*</span></label>
          <input type="text" inputmode="decimal" id="fJumlah">
        </div>
        <div class="field-group">
          <label>Tgl. Trn.</label>
          <input type="date" id="fTglTrn">
        </div>
      </div>

      <!-- Baris 3: Kas/Bank | Kurs | Mata Uang | Jumlah | Jurnal -->
      <div class="field-row">
        <div class="field-group wide">
          <label>Kas/Bank</label>
          <div class="with-btn">
            <input type="text" id="fKasBank" placeholder="Pilih akun kas/bank" list="kasBankList">
            <button class="btn-icon blue" id="btnPickKasBank" type="button">&#128269;</button>
          </div>
          <datalist id="kasBankList">
            <option value="Kas Kecil - HO">
            <option value="Bank Mandiri - HO">
            <option value="Bank BCA - HO">
          </datalist>
        </div>
        <div class="field-group narrow">
          <label>Kurs</label>
          <input type="text" id="fKursKasBank" disabled>
        </div>
        <div class="field-group narrow">
          <label>Mata Uang</label>
          <input type="text" id="fMataUangKasBank" disabled>
        </div>
        <div class="field-group">
          <label>Jumlah</label>
          <input type="text" id="fJumlahKasBank" disabled>
        </div>
        <div class="field-group">
          <label>Jurnal</label>
          <select id="fJurnalAkun">
            <option>Kas Kecil - HO</option>
            <option>Bank Mandiri - HO</option>
            <option>Bank BCA - HO</option>
          </select>
        </div>
      </div>

      <!-- Baris 4: Dibayar kepada/terima dari | Keterangan -->
      <div class="field-row">
        <div class="field-group wide">
          <label>Dibayar kepada / terima dari</label>
          <input type="text" id="fDibayarKepada" placeholder="Nama penerima">
        </div>
        <div class="field-group wide">
          <label>Keterangan</label>
          <textarea id="fKeterangan" placeholder="contoh: KAS BON ASMUNI ( TUNAI ) TGL 31/08/2026" style="min-height:38px;"></textarea>
        </div>
      </div>

      <!-- Rincian Jurnal Akun -->
      <div class="tabs" style="margin-top:20px;">
        <button class="tab-btn is-active" type="button" disabled>Rincian Jurnal Akun</button>
      </div>

      <div class="jurnal-toolbar">
        <div class="jurnal-radio-group">
          <label><input type="radio" name="fJurnalMode" value="otomatis" checked> Jurnal Otomatis</label>
          <label><input type="radio" name="fJurnalMode" value="manual"> Jurnal Manual</label>
        </div>
        <button class="btn btn-outline btn-sm" id="btnBuatJurnal" type="button">&#8635; Buat Jurnal</button>
      </div>

      <div class="jurnal-subheader">
        <span>&#9878; Rincian Jurnal Akun</span>
      </div>
      <div class="jurnal-table-wrap">
        <table class="jurnal-table">
          <thead>
            <tr>
              <th style="width:12%;">Kode Akun</th>
              <th style="width:12%;">Cost Center</th>
              <th style="width:16%;">Nama Akun</th>
              <th style="width:20%;">Keterangan</th>
              <th style="width:12%;">Komponen</th>
              <th style="width:12%;">Jumlah Debit</th>
              <th style="width:12%;">Jumlah Kredit</th>
              <th class="col-action">Hapus</th>
            </tr>
          </thead>
          <tbody id="jurnalTableBody">
            <!-- diisi oleh kasbon-form.js -->
          </tbody>
        </table>
      </div>
      <div class="table-actions-row">
        <button class="btn btn-outline btn-sm" id="btnAddJurnal" type="button">+ Tambah Item Baru</button>
        <span></span>
      </div>

      <div class="jurnal-balance-row">
        <div class="jurnal-balance-box">
          <label>Jumlah Debit - Kredit</label>
          <input type="text" id="jurnalBalance" disabled value="0,00">
        </div>
      </div>

      <div class="form-footer">
        <button class="btn btn-blue" id="btnSimpan" type="button">Simpan</button>
        <a class="btn btn-outline" href="daftar-kasbon.html" id="btnBatal">Batalkan</a>
      </div>

    </div>
  </div>
</main>

<script>window.APP_BASE = "../../";</script>
<script src="../../assets/js/karyawan-store.js"></script>
<script src="../../assets/js/kasbon-store.js"></script>
<script src="../../assets/js/shared.js"></script>
<script src="kasbon-form.js"></script>
</body>
</html>
