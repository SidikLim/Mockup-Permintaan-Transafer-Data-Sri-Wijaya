<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uang Muka Supplier 2 - MASERP Mockup</title>
<link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-active-menu="uang-muka-supplier-2">

<div id="app-header"></div>
<div id="app-sidebar"></div>

<main class="app-main">
  <div class="page-card">
    <div class="page-card__header">
      <div class="page-card__title">&#128274; Uang Muka Supplier 2</div>
      <div class="page-card__actions">
        <button class="btn btn-teal" id="btnFilterSemua" type="button">Semua &#9662;</button>
        <button class="btn btn-teal" id="btnTambah" type="button">+ Tambah</button>
        <button class="btn btn-outline" id="btnHelp" type="button">? Help</button>
      </div>
    </div>

    <div class="page-card__body">
      <div class="toolbar">
        <select class="select-pagesize" id="pageSize">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
        </select>
        <input class="search-input" id="searchInput" type="text" placeholder="Pencarian Global (no. uang muka, supplier)">
      </div>

      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>No. Uang Muka</th>
              <th>Tgl. Uang Muka</th>
              <th>Supplier</th>
              <th class="num">Jumlah</th>
              <th>Keterangan</th>
              <th>Lihat Invoice</th>
              <th>Cetak Invoice</th>
              <th>Ubah</th>
              <th>Hapus</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- diisi oleh daftar-uang-muka.js -->
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <div class="pagination__pages" id="paginationPages"></div>
        <div class="total-record" id="totalRecord">Total Record: 0</div>
      </div>
    </div>
  </div>
</main>

<script>window.APP_BASE = "../../";</script>
<script src="../../assets/js/data-store.js"></script>
<script src="../../assets/js/uang-muka-store.js"></script>
<script src="../../assets/js/shared.js"></script>
<script src="daftar-uang-muka.js"></script>
</body>
</html>
