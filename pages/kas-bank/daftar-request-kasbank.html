<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Daftar Transaksi Kas / Bank - MASERP Mockup</title>
<link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body data-active-menu="request-transaksi-kasbank">

<div id="app-header"></div>
<div id="app-sidebar"></div>

<main class="app-main">
  <div class="page-card">
    <div class="page-card__header">
      <div class="page-card__title">&#9873; Request Daftar Transaksi Kas / Bank</div>
      <div class="page-card__actions">
        <button class="month-picker" id="btnMonth" type="button">September 2026 &#9662;</button>
        <button class="btn btn-teal" id="btnTambah" type="button">+ Tambah</button>
      </div>
    </div>

    <div class="page-card__body">
      <div class="toolbar">
        <select class="select-pagesize" id="pageSize">
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="50">50</option>
        </select>
        <input class="search-input" id="searchInput" type="text" placeholder="Pencarian Global">
      </div>

      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>No. Transaksi</th>
              <th>Tgl. Trn.</th>
              <th>Keterangan</th>
              <th>Request By</th>
              <th>Approve By</th>
              <th>Status</th>
              <th class="num">Total</th>
              <th>Crc</th>
              <th>Ubah</th>
              <th>Hapus</th>
              <th>Lihat</th>
              <th>Cetak</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- diisi oleh daftar-request-kasbank.js -->
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <div class="pagination__pages" id="paginationPages"></div>
        <div class="total-record" id="totalRecord">Total Record: 0</div>
      </div>
    </div>
  </div>
</main>

<script>window.APP_BASE = "../../";</script>
<script src="../../assets/js/kasbank-store.js"></script>
<script src="../../assets/js/request-kasbank-store.js"></script>
<script src="../../assets/js/shared.js"></script>
<script src="daftar-request-kasbank.js"></script>
</body>
</html>
